# Пример инвентаря OrderFlow Platform.
# Скопируйте в deploy/inventory.ini (файл в .gitignore) и подставьте реальные адреса.
# Целевая ОС: Ubuntu 24.04 LTS (нужны пакеты docker.io и docker-compose-v2).

[orderflow]
orderflow-prod-1 ansible_host=203.0.113.10 ansible_user=deploy

[orderflow:vars]
ansible_python_interpreter=/usr/bin/python3
deploy_user=deploy
deploy_dir=/opt/orderflow
domain=orderflow.example.com
certbot_email=ops@example.com
image_tag=latest
# Секреты БД/админки задаются через ansible-vault в group_vars/all.yml
postgres_user=orderflow
