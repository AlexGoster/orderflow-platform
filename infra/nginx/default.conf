# Edge: reverse proxy + TLS + gzip + security headers + rate limit.
# Подключается из docker-compose.prod.yml (монтируется в /etc/nginx/conf.d/default.conf).

limit_req_zone $binary_remote_addr zone=orderflow_api:10m rate=10r/s;

map $http_x_request_id $rid {
    default $http_x_request_id;
    ""      $request_id;
}

upstream orderflow_api {
    server api:8000;
    keepalive 16;
}

log_format json_access escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"request_id":"$rid",'
    '"user_agent":"$http_user_agent"}';

server {
    listen 80;
    listen [::]:80;
    server_name orderflow.example.com _;

    server_tokens off;
    access_log /var/log/nginx/access.log json_access;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orderflow.example.com _;

    server_tokens off;
    access_log /var/log/nginx/access.log json_access;

    ssl_certificate     /etc/letsencrypt/live/orderflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orderflow.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: включается только вместе с рабочим сертификатом (см. docs/RUNBOOK.md)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Request-ID $rid always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $rid;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffers 8 8k;

    # /metrics закрыт для внешних сетей: Prometheus ходит в api:8000 напрямую.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        limit_req zone=orderflow_api burst=20 nodelay;
        proxy_pass http://orderflow_api;
    }

    location /api/ {
        limit_req zone=orderflow_api burst=20 nodelay;
        proxy_pass http://orderflow_api;
    }

    location / {
        proxy_pass http://orderflow_api;
    }
}
