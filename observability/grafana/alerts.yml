# Grafana unified alerting — provisioning алертов (папка OrderFlow).
# Datasource uid должен совпадать с observability/grafana/provisioning/datasources/prometheus.yml.
apiVersion: 1

groups:
  - orgId: 1
    name: orderflow-slo
    folder: OrderFlow
    interval: 1m
    rules:
      - uid: orderflow-high-error-rate
        title: High error rate (> 5%)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                sum(rate(http_requests_total{status=~"5.."}[5m]))
                  /
                clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
              instant: true
              legendFormat: error ratio
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Доля 5xx выше 5%"
          description: "Ошибка SLO-метрики доступности, см. docs/SLO.md"
          runbook_url: "https://github.com/AlexGoster/orderflow-platform/blob/main/docs/RUNBOOK.md"
        labels:
          severity: critical
          team: platform

      - uid: orderflow-high-p95
        title: High p95 latency (> 200 ms)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                histogram_quantile(
                  0.95,
                  sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
                )
              instant: true
              legendFormat: p95
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.2
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "p95 выше 200 мс"
          description: "Просадка латентности по SLO, см. docs/RUNBOOK.md"
          runbook_url: "https://github.com/AlexGoster/orderflow-platform/blob/main/docs/RUNBOOK.md"
        labels:
          severity: warning
          team: platform

      - uid: orderflow-api-down
        title: API down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="api"}
              instant: true
              legendFormat: api
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "API не отвечает"
          description: "Цель api недоступна для Prometheus, см. docs/RUNBOOK.md"
          runbook_url: "https://github.com/AlexGoster/orderflow-platform/blob/main/docs/RUNBOOK.md"
        labels:
          severity: critical
          team: platform
