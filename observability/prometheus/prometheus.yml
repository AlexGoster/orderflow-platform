# Prometheus: сбор метрик API + алерты (rules.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    stack: orderflow-platform

rule_files:
  - /etc/prometheus/rules.yml

# Оповещения принимает Grafana (provisioning: ../grafana/alerts.yml),
# Alertmanager подключается при появлении почты/Telegram — см. docs/RUNBOOK.md.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: api
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets:
          - api:8000
        labels:
          service: orderflow-api
          tier: backend
