[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-platform"
version = "1.0.0"
description = "OrderFlow Platform — CI/CD, безопасность и наблюдаемость для экосистемы OrderFlow"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7.8",
    "pip-audit>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
orderflow-api = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B008",  # Depends()/Query() в дефолтах — идиоматично для FastAPI
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["N814"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["sentry_sdk.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = false
source = ["app"]
omit = [
    "app/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_empty = true

# Конфигурация bandit: python -m bandit -c pyproject.toml -r app -q
# (без -c используется профиль по умолчанию; exclude_dirs читается только из конфига)
[tool.bandit]
exclude_dirs = [
    ".venv",
    "venv",
    "build",
    "dist",
    "alembic",
    "tests",
    "docs",
    "deploy",
    "infra",
    "observability",
    "security",
    "scripts",
    ".github",
]
skips = []
